<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>今日は、誰の番。</title>
<style>
  :root {
    --ivory: #F5F0E8;
    --ivory-deep: #EDE6D8;
    --green: #3D5A45;
    --green-soft: #5C7A63;
    --terra: #C77B4F;
    --gold: #C9A86A;
    --ink: #3A3630;
    --ink-soft: #7A7264;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "Noto Serif JP", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "BIZ UDMincho", serif;
    background: var(--ivory);
    color: var(--ink);
    letter-spacing: 0.08em;
    line-height: 1.8;
    min-height: 100vh;
    /* 紙のような質感(ごく淡い繊維ノイズ) */
    background-image:
      radial-gradient(rgba(61, 90, 69, 0.025) 1px, transparent 1px),
      radial-gradient(rgba(199, 123, 79, 0.02) 1px, transparent 1px);
    background-size: 7px 7px, 11px 11px;
    background-position: 0 0, 4px 6px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  /* ---------- タイトル ---------- */
  header { text-align: center; margin-bottom: 40px; position: relative; }

  /* 結果画面の上からでも消せるよう、常に最前面に固定 */
  .btn-sound {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    right: calc(env(safe-area-inset-right) + 14px);
    z-index: 20;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(61, 90, 69, 0.25);
    border-radius: 50%;
    background: rgba(245, 240, 232, 0.88);
    color: var(--green);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease-out, background 0.5s ease-out, transform 0.5s ease-out;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-sound:active { transform: scale(0.94); background: rgba(61, 90, 69, 0.08); }

  .btn-sound.off { opacity: 0.35; }

  .btn-sound.off::after {
    content: "";
    position: absolute;
    left: 9px;
    right: 9px;
    top: 50%;
    height: 1px;
    background: var(--green);
    transform: rotate(-35deg);
  }

  .title {
    font-size: 1.7rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--ink);
  }

  .subtitle {
    margin-top: 10px;
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
  }

  .subtitle::before, .subtitle::after {
    content: "—";
    margin: 0 0.8em;
    color: var(--gold);
  }

  /* ---------- セクション見出し ---------- */
  .label {
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    color: var(--green);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(61, 90, 69, 0.18);
  }

  section { margin-bottom: 36px; }

  /* ---------- 人数設定 ---------- */
  .counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .counter button {
    width: 52px;
    height: 52px;
    border: 1px solid rgba(61, 90, 69, 0.35);
    border-radius: 50%;
    background: transparent;
    color: var(--green);
    font-size: 1.5rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.45s ease-out, transform 0.45s ease-out, opacity 0.3s ease-out;
    -webkit-tap-highlight-color: transparent;
  }

  .counter button:active {
    background: rgba(61, 90, 69, 0.08);
    transform: scale(0.94);
  }

  .counter button:disabled { opacity: 0.25; cursor: default; }

  .counter .count {
    font-size: 2rem;
    min-width: 3.2em;
    text-align: center;
    color: var(--ink);
  }

  .counter .count small {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-left: 0.4em;
    letter-spacing: 0.2em;
  }

  /* ---------- 名前入力 ---------- */
  .names { display: flex; flex-direction: column; gap: 10px; }

  .names input {
    width: 100%;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: rgba(255, 253, 248, 0.7);
    border: 1px solid rgba(61, 90, 69, 0.2);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.4s ease-out, background 0.4s ease-out;
  }

  .names input::placeholder { color: #B8AF9E; }

  .names input:focus {
    border-color: var(--green-soft);
    background: #FFFDF8;
  }

  /* ---------- ルーレット ---------- */
  .wheel-area {
    position: relative;
    width: min(82vw, 340px);
    margin: 8px auto 0;
  }

  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 20px solid var(--terra);
    z-index: 2;
    filter: drop-shadow(0 1px 1px rgba(58, 54, 48, 0.2));
  }

  .wheel-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    box-shadow:
      0 6px 24px rgba(58, 54, 48, 0.12),
      0 0 0 6px rgba(255, 253, 248, 0.8),
      0 0 0 7px rgba(201, 168, 106, 0.5);
  }

  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    will-change: transform;
  }

  #wheel text {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
  }

  .hub-note {
    text-align: center;
    margin-top: 22px;
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
    min-height: 1.6em;
    transition: opacity 0.6s ease-out;
  }

  /* ---------- 回すボタン ---------- */
  .spin-row { text-align: center; margin-top: 26px; }

  .btn-spin {
    font-family: inherit;
    font-size: 1.05rem;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: var(--ivory);
    background: var(--green);
    border: none;
    border-radius: 999px;
    padding: 17px 64px;
    cursor: pointer;
    transition: transform 0.5s ease-out, opacity 0.4s ease-out, background 0.5s ease-out;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-spin:active { transform: scale(0.96); background: #35503D; }
  .btn-spin:disabled { opacity: 0.4; cursor: default; }

  /* ---------- 結果 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(245, 240, 232, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease-out;
    z-index: 10;
    padding: 24px;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .result {
    text-align: center;
    max-width: 340px;
    width: 100%;
    transform: translateY(14px);
    opacity: 0;
    transition: transform 1s ease-out, opacity 1s ease-out;
    transition-delay: 0.25s;
  }

  .overlay.show .result { transform: translateY(0); opacity: 1; }

  .result-eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.4em;
    color: var(--terra);
    margin-bottom: 20px;
  }

  .result-name {
    font-size: 2.3rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--ink);
    line-height: 1.4;
    word-break: break-all;
    padding-bottom: 18px;
    position: relative;
  }

  .result-name::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 2px;
    background: var(--gold);
  }

  .result-name small {
    font-size: 1.1rem;
    color: var(--ink-soft);
    margin-left: 0.3em;
  }

  .result-message {
    margin-top: 26px;
    font-size: 0.95rem;
    color: var(--green);
    letter-spacing: 0.12em;
    line-height: 2.1;
  }

  .result-actions {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  .btn-again {
    font-family: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--ivory);
    background: var(--terra);
    border: none;
    border-radius: 999px;
    padding: 15px 52px;
    cursor: pointer;
    transition: transform 0.5s ease-out, background 0.5s ease-out;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-again:active { transform: scale(0.96); background: #B06A41; }

  .btn-close {
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    padding: 10px 24px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 木の葉がふわっと舞う演出(控えめ) */
  .leaf {
    position: absolute;
    top: -24px;
    width: 10px;
    height: 14px;
    border-radius: 60% 5% 60% 5%;
    opacity: 0;
    animation: leaf-fall 5.5s ease-out forwards;
    pointer-events: none;
  }

  @keyframes leaf-fall {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    12%  { opacity: 0.75; }
    100% { opacity: 0; transform: translateY(105vh) rotate(300deg); }
  }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: #B0A794;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <button type="button" class="btn-sound" id="btnSound" aria-pressed="true" aria-label="BGMの入切">♪</button>
    <h1 class="title">今日は、誰の番。</h1>
    <p class="subtitle">お支払いルーレット</p>
  </header>

  <section>
    <h2 class="label">にんずう</h2>
    <div class="counter">
      <button type="button" id="btnMinus" aria-label="人数を減らす">−</button>
      <div class="count"><span id="countNum">4</span><small>人</small></div>
      <button type="button" id="btnPlus" aria-label="人数を増やす">＋</button>
    </div>
  </section>

  <section>
    <h2 class="label">なまえ</h2>
    <div class="names" id="nameList"></div>
  </section>

  <section>
    <h2 class="label">ルーレット</h2>
    <div class="wheel-area">
      <div class="pointer"></div>
      <div class="wheel-wrap">
        <svg id="wheel" viewBox="0 0 300 300" aria-hidden="true"></svg>
      </div>
    </div>
    <p class="hub-note" id="hubNote">力を抜いて、まわしてみて。</p>
    <div class="spin-row">
      <button type="button" class="btn-spin" id="btnSpin">まわす</button>
    </div>
  </section>

  <footer>ごちそうさまの、その前に。</footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resultName">
  <div class="result">
    <p class="result-eyebrow">きょうのお支払い</p>
    <p class="result-name"><span id="resultName"></span><small>さん</small></p>
    <p class="result-message" id="resultMessage"></p>
    <div class="result-actions">
      <button type="button" class="btn-again" id="btnAgain">もう一回</button>
      <button type="button" class="btn-close" id="btnClose">とじる</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SPIN_SEC = 3.6;   // ルーレットの回転時間(秒)。BGMの減速もこれに合わせる

  /* ===================================================================
     BGM:Web Audio API による合成音(音源ファイル・外部リソースは不使用)
     シーンは「待機」「回転中」「結果」の3つ。ヘ長調のペンタトニックを
     基調に、木や紙のような柔らかい減衰音でゆったり鳴らす。
     =================================================================== */
  var Sound = (function () {
    var ctx = null, master = null, dry = null, wet = null, bus = null;
    var scene = null, wantScene = 'idle';
    var step = 0, nextTime = 0, timer = null;
    var spinAt = 0;
    var VOLUME = 0.5;
    var enabled = true;

    try { enabled = localStorage.getItem('roulette-sound') !== 'off'; } catch (e) {}

    // ヘ長調のペンタトニック(F G A C D)
    var PENTA = [65, 67, 69, 72, 74, 77, 79];

    // 待機シーンの和音進行:Fmaj7 → Dm7 → B♭maj7 → C7sus4
    var IDLE_CHORDS = [
      { bass: [41, 48], tones: [53, 57, 60, 64] },
      { bass: [38, 45], tones: [50, 53, 57, 60] },
      { bass: [34, 41], tones: [46, 50, 53, 57] },
      { bass: [36, 43], tones: [48, 53, 55, 58] }
    ];

    function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    // 残響用インパルス応答をノイズ減衰から生成
    function impulse(sec, decay) {
      var rate = ctx.sampleRate, len = Math.floor(rate * sec);
      var buf = ctx.createBuffer(2, len, rate);
      for (var c = 0; c < 2; c++) {
        var d = buf.getChannelData(c);
        for (var i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    function init() {
      if (ctx) return true;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { ctx = new AC(); } catch (e) { return false; }

      master = ctx.createGain();
      master.gain.value = enabled ? VOLUME : 0.0001;

      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.ratio.value = 3;
      master.connect(comp);
      comp.connect(ctx.destination);

      dry = ctx.createGain();
      dry.gain.value = 0.72;
      dry.connect(master);

      var conv = ctx.createConvolver();
      conv.buffer = impulse(2.6, 2.6);
      wet = ctx.createGain();
      wet.gain.value = 0.34;
      wet.connect(conv);
      conv.connect(master);

      return true;
    }

    function newBus() {
      var g = ctx.createGain();
      g.gain.value = 1;
      g.connect(dry);
      g.connect(wet);
      return g;
    }

    // シーン切替時、前のシーンの余韻をふわっと消す
    function fadeOut(g) {
      if (!g) return;
      var t = ctx.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 1.1);
      setTimeout(function () { try { g.disconnect(); } catch (e) {} }, 2400);
    }

    // 撥弦・打鍵のような減衰音
    function pluck(midi, when, dur, vol, wave, cutoff) {
      var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.Q.value = 0.6;
      f.frequency.setValueAtTime(cutoff || 2200, when);
      f.frequency.exponentialRampToValueAtTime(600, when + dur);
      o.type = wave || 'triangle';
      o.frequency.value = mtof(midi);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(vol, when + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(f); f.connect(g); g.connect(bus);
      o.start(when);
      o.stop(when + dur + 0.06);
    }

    // 下支えの持続音
    function pad(midi, when, dur, vol) {
      var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 900;
      o.type = 'sine';
      o.frequency.value = mtof(midi);
      o.detune.value = (Math.random() - 0.5) * 6;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(vol, when + dur * 0.35);
      g.gain.linearRampToValueAtTime(0.0001, when + dur);
      o.connect(f); f.connect(g); g.connect(bus);
      o.start(when);
      o.stop(when + dur + 0.05);
    }

    /* --- 待機:1拍1秒、4小節で一巡。合間にまばらな単音 --- */
    function idleStep(s, t) {
      var chord = IDLE_CHORDS[Math.floor(s / 4) % 4];
      if (s % 4 === 0) {
        pad(chord.bass[0], t, 4.4, 0.055);
        pad(chord.bass[1], t, 4.4, 0.04);
        for (var i = 0; i < chord.tones.length; i++) {
          pluck(chord.tones[i], t + i * 0.09, 2.6, 0.075, 'triangle', 1800);
        }
      } else if (Math.random() < 0.45) {
        pluck(PENTA[Math.floor(Math.random() * PENTA.length)],
              t + Math.random() * 0.12, 2.2, 0.05, 'sine', 2600);
      }
    }

    /* --- 回転中:盤の減速に合わせて音の間隔も伸び、音色も暗く沈む --- */
    function spinProgress() {
      return Math.min(1, Math.max(0, (ctx.currentTime - spinAt) / SPIN_SEC));
    }

    function spinStepDur() {
      return 0.1 + 0.62 * Math.pow(spinProgress(), 2.6);
    }

    var SPIN_SEQ = [65, 69, 72, 74, 77, 79, 77, 74, 72, 69];

    function spinStep(s, t) {
      var p = spinProgress();
      pluck(SPIN_SEQ[s % SPIN_SEQ.length], t, 0.9 + p * 1.6,
            0.052 + p * 0.03, 'triangle', 2400 - p * 900);
      if (s % 4 === 0) pluck(41, t, 1.4, 0.07, 'sine', 700);
    }

    /* --- 結果:解決する分散和音のあと、穏やかな2和音の循環 --- */
    function resultIntro(t) {
      var arp = [58, 62, 65, 69, 72, 77];
      for (var i = 0; i < arp.length; i++) {
        pluck(arp[i], t + i * 0.075, 3.2, 0.085, 'triangle', 2600);
      }
      pad(41, t, 6.5, 0.06);
      pad(53, t + 0.1, 6.0, 0.045);
      pad(60, t + 0.2, 5.6, 0.04);
    }

    function resultStep(s, t) {
      if (s % 4 === 0) {
        var ch = (Math.floor(s / 4) % 2 === 0) ? [41, 53, 57, 60] : [46, 53, 57, 62];
        pad(ch[0], t, 5.2, 0.05);
        for (var i = 1; i < ch.length; i++) {
          pluck(ch[i], t + i * 0.08, 3.0, 0.05, 'sine', 1900);
        }
      } else if (Math.random() < 0.35) {
        pluck(PENTA[3 + Math.floor(Math.random() * 4)], t, 2.4, 0.045, 'sine', 2800);
      }
    }

    /* --- 先読みスケジューラ --- */
    function stepDur() {
      if (scene === 'spin') return spinStepDur();
      if (scene === 'result') return 1.25;
      return 1.0;
    }

    function playStep(s, t) {
      if (scene === 'idle') idleStep(s, t);
      else if (scene === 'spin') spinStep(s, t);
      else if (scene === 'result') resultStep(s, t);
    }

    function loop() {
      if (!ctx || !scene) return;
      if (!enabled) {
        if (timer) { clearInterval(timer); timer = null; }
        return;
      }
      // タブが背面に回るなどで時刻が飛んだ場合は追いつかせる
      if (nextTime < ctx.currentTime - 1) nextTime = ctx.currentTime + 0.05;
      while (nextTime < ctx.currentTime + 0.15) {
        playStep(step, nextTime);
        nextTime += stepDur();
        step++;
      }
    }

    function setScene(name) {
      wantScene = name;
      if (!enabled || !init()) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (scene === name && name !== 'spin') return;

      fadeOut(bus);
      bus = newBus();
      scene = name;
      step = 0;
      nextTime = ctx.currentTime + 0.06;
      if (name === 'spin') spinAt = ctx.currentTime;
      if (name === 'result') resultIntro(nextTime);
      if (!timer) timer = setInterval(loop, 40);
      loop();
    }

    // ボタンを押したときの小さな音
    function tap() {
      if (!ctx || !enabled) return;
      var t = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 1400;
      o.type = 'sine';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(520, t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(f); f.connect(g); g.connect(dry); g.connect(wet);
      o.start(t);
      o.stop(t + 0.2);
    }

    function setEnabled(v) {
      enabled = v;
      try { localStorage.setItem('roulette-sound', v ? 'on' : 'off'); } catch (e) {}
      if (v) {
        scene = null;
        setScene(wantScene);
        if (ctx) {
          if (ctx.state === 'suspended') ctx.resume();
          var t = ctx.currentTime;
          master.gain.cancelScheduledValues(t);
          master.gain.setValueAtTime(master.gain.value, t);
          master.gain.linearRampToValueAtTime(VOLUME, t + 0.5);
        }
      } else if (ctx) {
        var t2 = ctx.currentTime;
        master.gain.cancelScheduledValues(t2);
        master.gain.setValueAtTime(master.gain.value, t2);
        master.gain.linearRampToValueAtTime(0.0001, t2 + 0.4);
      }
    }

    return {
      scene: setScene,
      tap: tap,
      setEnabled: setEnabled,
      isEnabled: function () { return enabled; }
    };
  })();

  var MIN = 2, MAX = 10;
  var count = 4;
  var names = [];          // 入力値(空文字あり)
  var rotation = 0;        // 累積回転角(deg)
  var spinning = false;

  // セグメント配色(生成り・深緑・テラコッタ・淡金・くすみ緑)
  var PALETTE = ['#3D5A45', '#C77B4F', '#C9A86A', '#5C7A63', '#A8674B', '#8A9B7E'];
  // 各色の上に置く文字色
  var TEXT_ON = {
    '#3D5A45': '#F5F0E8', '#C77B4F': '#F5F0E8', '#C9A86A': '#3A3630',
    '#5C7A63': '#F5F0E8', '#A8674B': '#F5F0E8', '#8A9B7E': '#3A3630'
  };

  // 岡山弁っぽい脱力系メッセージ
  var MESSAGES = [
    '今日は、あなたの番じゃわ。',
    'まあ、ええがん。そういう日もあるが。',
    '財布、ぬくうなっとる?',
    'なんも言わんと、スッと出すんが粋じゃけぇ。',
    '大丈夫。みんな、ちゃんと覚えとるけぇ。',
    '気にせんでええ。ごはんがおいしかったら、それでええんじゃ。',
    'ようこそ、お支払いの世界へ。',
    '深呼吸して、レジへ向かおうや。',
    '今日のところは、頼んますわ。',
    'ま、そういうこともあらぁ。次は知らんけど。'
  ];

  var $ = function (id) { return document.getElementById(id); };
  var countNum = $('countNum'), btnMinus = $('btnMinus'), btnPlus = $('btnPlus');
  var nameList = $('nameList'), wheel = $('wheel'), btnSpin = $('btnSpin');
  var hubNote = $('hubNote'), overlay = $('overlay');
  var resultName = $('resultName'), resultMessage = $('resultMessage');

  function displayName(i) {
    var n = (names[i] || '').trim();
    return n !== '' ? n : 'メンバー' + (i + 1);
  }

  // 人数が少ないとコマが大きすぎてルーレットらしくないので、同じ人を
  // 複数コマに散らして割る。2人→8コマ、3人→9コマ、4人→8コマ。
  var REPEAT = { 2: 4, 3: 3, 4: 2 };

  function sliceCount(n) { return n * (REPEAT[n] || 1); }

  function segColors(n) {
    var colors = [];
    for (var i = 0; i < n; i++) {
      var c = PALETTE[i % PALETTE.length];
      // 最後のセグメントが先頭と同色で隣接する場合はずらす
      if (i === n - 1 && c === colors[0]) c = PALETTE[(i + 1) % PALETTE.length];
      colors.push(c);
    }
    return colors;
  }

  function polar(cx, cy, r, deg) {
    var rad = (deg - 90) * Math.PI / 180; // 0degを真上に
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }

  function truncate(s, max) {
    return s.length > max ? s.slice(0, max) + '…' : s;
  }

  function buildWheel() {
    var n = count;
    var total = sliceCount(n);
    var seg = 360 / total;
    var colors = segColors(n);
    var svg = [];
    var cx = 150, cy = 150, r = 148;

    for (var i = 0; i < total; i++) {
      var m = i % n;   // このコマに割り当てられた人
      var a0 = i * seg, a1 = (i + 1) * seg;
      var p0 = polar(cx, cy, r, a0);
      var p1 = polar(cx, cy, r, a1);
      var large = seg > 180 ? 1 : 0;
      svg.push(
        '<path d="M' + cx + ' ' + cy +
        ' L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
        ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' +
        p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
        ' Z" fill="' + colors[m] + '" stroke="#F5F0E8" stroke-width="1.5"/>'
      );

      // ラベル:セグメント中央角に沿って配置。下半分は180度反転して読みやすく
      var mid = a0 + seg / 2;
      // コマが細かいときは文字を小さく・外寄りにして中心の飾りとの重なりを避ける
      var tp = polar(cx, cy, r * (total >= 9 ? 0.66 : 0.62), mid);
      var label = truncate(displayName(m), 6);
      var textRot = (mid > 90 && mid < 270) ? mid + 180 : mid;
      svg.push(
        '<text x="' + tp[0].toFixed(2) + '" y="' + tp[1].toFixed(2) + '"' +
        ' font-size="' + (total >= 9 ? 11 : 13) + '"' +
        ' fill="' + TEXT_ON[colors[m]] + '"' +
        ' text-anchor="middle" dominant-baseline="middle"' +
        ' transform="rotate(' + textRot.toFixed(2) + ' ' + tp[0].toFixed(2) + ' ' + tp[1].toFixed(2) + ')">' +
        escapeHtml(label) + '</text>'
      );
    }

    // 中心の飾り(小さな円)
    svg.push('<circle cx="150" cy="150" r="26" fill="#F5F0E8"/>');
    svg.push('<circle cx="150" cy="150" r="26" fill="none" stroke="#C9A86A" stroke-width="1.5"/>');
    svg.push('<circle cx="150" cy="150" r="4" fill="#3D5A45"/>');

    wheel.innerHTML = svg.join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function resetWheelRotation() {
    rotation = 0;
    wheel.style.transition = 'none';
    wheel.style.transform = 'rotate(0deg)';
    // 次フレームで transition を戻す
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { wheel.style.transition = ''; });
    });
  }

  /* ---------- 人数 ---------- */
  function renderCount() {
    countNum.textContent = count;
    btnMinus.disabled = count <= MIN;
    btnPlus.disabled = count >= MAX;
  }

  function renderNames() {
    nameList.innerHTML = '';
    for (var i = 0; i < count; i++) {
      (function (idx) {
        var input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 12;
        input.placeholder = 'メンバー' + (idx + 1);
        input.value = names[idx] || '';
        input.setAttribute('aria-label', (idx + 1) + '人目の名前');
        input.addEventListener('input', function () {
          names[idx] = input.value;
          buildWheel();
        });
        nameList.appendChild(input);
      })(i);
    }
  }

  function setCount(n) {
    if (spinning) return;
    count = Math.min(MAX, Math.max(MIN, n));
    renderCount();
    renderNames();
    buildWheel();
    resetWheelRotation();
  }

  btnMinus.addEventListener('click', function () { Sound.tap(); setCount(count - 1); });
  btnPlus.addEventListener('click', function () { Sound.tap(); setCount(count + 1); });

  /* ---------- 抽選 ---------- */
  function spin() {
    if (spinning) return;
    spinning = true;
    btnSpin.disabled = true;
    hubNote.style.opacity = '0';
    Sound.scene('spin');

    var n = count;
    var total = sliceCount(n);
    var seg = 360 / total;
    // コマ単位で完全ランダムに選ぶ。コマ数は人数の整数倍なので偏りは出ない。
    var slice = Math.floor(Math.random() * total);
    var winner = slice % n;

    // 当選コマの中心が真上(ポインター)に来る角度。
    // コマ内で±35%の揺らぎを持たせ、毎回同じ止まり方に見えないように。
    var jitter = (Math.random() - 0.5) * seg * 0.7;
    var target = 360 - (slice * seg + seg / 2 + jitter);
    var current = ((rotation % 360) + 360) % 360;
    var delta = ((target - current) % 360 + 360) % 360;
    var turns = 8 + Math.floor(Math.random() * 3); // 8〜10周
    rotation += turns * 360 + delta;

    wheel.style.transition = 'transform ' + SPIN_SEC + 's cubic-bezier(0.08, 0.68, 0.13, 1)';
    wheel.style.transform = 'rotate(' + rotation + 'deg)';

    var done = false;
    function finish() {
      if (done) return;
      done = true;
      spinning = false;
      btnSpin.disabled = false;
      showResult(winner);
    }
    wheel.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, SPIN_SEC * 1000 + 500); // transitionend が来ない環境への保険
  }

  btnSpin.addEventListener('click', function () { Sound.tap(); spin(); });

  /* ---------- 結果表示 ---------- */
  function showResult(winner) {
    resultName.textContent = displayName(winner);
    resultMessage.textContent = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
    overlay.classList.add('show');
    Sound.scene('result');
    dropLeaves();
    setTimeout(function () {
      hubNote.textContent = 'おつかれさま。また、まわしてもええよ。';
      hubNote.style.opacity = '1';
    }, 800);
  }

  function dropLeaves() {
    var colors = ['#C9A86A', '#C77B4F', '#8A9B7E'];
    for (var i = 0; i < 10; i++) {
      var leaf = document.createElement('span');
      leaf.className = 'leaf';
      leaf.style.left = (5 + Math.random() * 90) + '%';
      leaf.style.background = colors[i % colors.length];
      leaf.style.animationDelay = (Math.random() * 1.4) + 's';
      leaf.style.animationDuration = (4.5 + Math.random() * 2.5) + 's';
      overlay.appendChild(leaf);
      (function (el) {
        setTimeout(function () { el.remove(); }, 9000);
      })(leaf);
    }
  }

  $('btnAgain').addEventListener('click', function () {
    Sound.tap();
    overlay.classList.remove('show');
    // オーバーレイが消えてから回す(ふわっと)
    setTimeout(spin, 450);
  });

  $('btnClose').addEventListener('click', function () {
    Sound.tap();
    overlay.classList.remove('show');
    Sound.scene('idle');
  });

  /* ---------- BGMの入切 ---------- */
  var btnSound = $('btnSound');

  function renderSound() {
    var on = Sound.isEnabled();
    btnSound.classList.toggle('off', !on);
    btnSound.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  btnSound.addEventListener('click', function () {
    Sound.setEnabled(!Sound.isEnabled());
    renderSound();
  });

  // 自動再生は各ブラウザで制限されるため、最初のタップでBGMを始める
  document.addEventListener('pointerdown', function () {
    Sound.scene('idle');
  }, { once: true });

  /* ---------- 初期化 ---------- */
  renderCount();
  renderNames();
  buildWheel();
  renderSound();
})();
</script>
</body>
</html>
